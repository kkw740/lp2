<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ass6 - Admin Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1>Admin Login</h1>
        <p class="sub">
          Demo login (UI only). Use username <b>admin</b> and password
          <b>admin123</b>.
        </p>
      </div>
    </header>

    <main class="container">
      <div class="card" style="max-width: 420px">
        <form id="loginForm" novalidate>
          <div class="form-field">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="admin"
            />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="admin123"
            />
          </div>
          <button type="submit">Login</button>
          <button
            type="button"
            id="fillDemo"
            class="btn-ghost"
            style="margin-left: 8px"
          >
            Fill demo
          </button>
          <div id="loginMsg" class="notice error" role="alert"></div>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">© 2025 Admin UI</div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>

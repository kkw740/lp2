<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>EventZone</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Event</a>
            <a href="event-registration.html" class="active">Register</a>
        </nav>
    </header>
    <main class="container">
        <section class="card">
            <h2>Event Registration Form</h2>
            <form class="form-box" id="eventForm">
                <label for="name"> Full Name</label>
                <input type="text" id="name" placeholder="Enter your Full Name" required>
                <small class="hint">Max 20 characters allowed.</small>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your Email" required>
                <small class="hint">Ex: you@example.com</small>

                <label for="Password">Password</label>
                <input type="password" id="password" placeholder="Enter your Password" required>
                <small class="hint">Atleast 1 Uppercase, 1 Numeric, 1 Symbol, Max 8 characters only.</small>

                <label for="Phone">Mobile</label>
                <input type="number" id="mobile" placeholder="Enter your Mobile Number" required>
                <small class="hint">Ex : 1234567891</small>

                <label for="event-name">Event Name</label>
                <input type="text" id="event-name" placeholder="Enter your Event Name" required>

                <label for="location">Event Location</label>
                <input type="text" id="location" placeholder="Enter your Event Location" required>
                
                <label for="date">Event Date</label>
                <input type="date" id="date" required>
                
                <label for="time">Event Time</label>
                <input type="time" id="time"  required>

                <button class="btn-primary" type="submit">Register</button>
            </form>
        </section>
    </main>

    <footer>
    <p>&copy; 2025 EventZone. All Rights Reserved.</p>
  </footer>

  <script>
    document.getElementById('eventForm').addEventListener('submit', function (e){
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const mobile = document.getElementById('mobile').value.trim();

        if(name.length === 0 || name.length > 20){
        alert('Name must be between 1 and 20 characters.');
        return;
        }

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(!emailPattern.test(email)){
            alert('Please enter a valid email address.');
            return;
        }

        const passwordPattern = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{6,8}$/;
        if(!passwordPattern.test(password)){
            alert('Please enter a valid password.');
            return;
        }

        const mobilePattern = /^\d{10}$/;
        if(!mobilePattern.test(mobile)){
            alert('Please enter a valid mobile number.');
            return;
        }

        alert('Registration Sucessfull!.Your form has been submitted.');
        this.reset();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ass3 - Event Registration (Validation)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1>Event Registration</h1>
        <p class="desc">
          Fill the form below. We validate Name, Email, and Mobile Number using
          JavaScript.
        </p>
      </div>
    </header>

    <main class="container">
      <form id="regForm" novalidate>
        <div class="form-field">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            aria-describedby="nameHelp"
          />
          <small id="nameHelp" class="error" aria-live="polite"></small>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            aria-describedby="emailHelp"
          />
          <small id="emailHelp" class="error" aria-live="polite"></small>
        </div>

        <div class="form-field">
          <label for="mobile">Mobile Number</label>
          <input
            type="text"
            id="mobile"
            name="mobile"
            placeholder="10 digit number"
            aria-describedby="mobileHelp"
          />
          <small id="mobileHelp" class="error" aria-live="polite"></small>
        </div>

        <button type="submit">Register</button>
        <div id="formMsg" class="alert" style="display: none"></div>
      </form>
    </main>

    <footer>
      <div class="container">© 2025 Event Form</div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
